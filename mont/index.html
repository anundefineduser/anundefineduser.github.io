<!DOCTYPE html>
<html>
    <head>
        <title>mont</title>
        <style>
            body {
                background-color: black;
            }

            img {
                max-height: 50%;
                text-align: center;
                position: absolute;
                inset: 0;
                margin: auto;
            }

            video {
                height: 100%;
                width: 100%;
                text-align: center;
                position: absolute;
                inset: 0;
                margin: auto;
            }
        </style>
        
        <link rel="icon" type="image/x-icon" href="./images/favicon.png">
        <meta charset="UTF-8">
        <meta property="og:title" content="mont">    
        <meta name="twitter:title" content="mont">
        <meta property="og:description" content="mont">
        <meta name="twitter:description" content="mont">
        <meta name="description" content="mont">
        <meta property="og:image" content="/mont/images/mont.png">
        <meta name="twitter:image" content="/mont/images/mont.png">
        <meta name="twitter:card" content="summary_large_image">
    </head>
    <body>
        <img id="mont" src="" style="">
        <video id="nostalgia" src="./nostalgia.mp4" type="video/mp4" hidden>
        <script>
            const mont = document.querySelector("#mont");
            const img = [
                "beast.png",
                "chased.png",
                "gayming.jpg",
                "mont.png",
                "aldren.png",
                "floib.png",
                "juego.png",
                "mog.png",
                "mog2.png",
                "ron.png",
                "whothefuck.png",
                "whothefuck2.png",
                "shaggy.jpg",
                "slendermont.png",
                "slendermont.png",
                "stew.png",
                "vibingmont.png",
                "chud.png",
                "grugont.png",
                "orange.png"
            ];
            let last = parseInt(localStorage.getItem('lastMont'));
            if (last === NaN)
                last = -1;

            let removed = img.slice();
            if (last != -1)
                removed.splice(last, 1);
            // console.log(removed);

            const removedIndex = Math.floor(Math.random() * removed.length);
            const src = removed[removedIndex];
            // console.log(src);
            mont.setAttribute('src', `./images/${src}`);
            localStorage.setItem('lastMont', img.indexOf(src));

            let start;
            let elapsed;
            let timer = 0;
            function update(time) {
                if (start === undefined) start = time;
                elapsed = time - start;
                start = time;
                timer += elapsed * (1 * 1/1000);
                let x = Math.sin(timer) * 100;
                let y = -Math.cos(timer) * 100;
                mont.setAttribute('style', `transform: translate(${x}px, ${y}px);`)
                console.log(x);
                requestAnimationFrame(update);
            }

            const keyListener = (seq, callback) => {
                let i = 0;
                const keys = seq.split('').map(key => key.toLowerCase());
                return (event) => {
                    const pressed = event.key.toLowerCase();
                    if (pressed === keys[i]) {
                        i++;
                        if (i === keys.length) {
                            callback();
                            i = 0;
                        }
                    }
                    else {
                        i = 0;
                        if (pressed === keys[0])
                            i = 1;
                    }
                }
            }
            
            const audio = new Audio("./glacier.ogg");
            const listener = keyListener('mont', () => {
                document.removeEventListener('keydown', listener);
                document.removeEventListener('keydown', vidListener);
                audio.loop = true;
                audio.play();
                document.body.setAttribute('style', 'background-image: url(\'https://media1.tenor.com/m/88dnH_mHRLAAAAAC/static-tv-static.gif\');');
                requestAnimationFrame(update);
            });

            const video = document.querySelector("#nostalgia");
            video.addEventListener('ended', (e) => {
                window.close('','_parent','');
            });
            const vidListener = keyListener('nostalgia', () => {
                document.removeEventListener('keydown', listener);
                document.removeEventListener('keydown', vidListener);
                mont.setAttribute('hidden', '')
                video.removeAttribute('hidden');
                video.controls = false;
                video.play();
            });
            document.addEventListener('keydown', listener);
            document.addEventListener('keydown', vidListener);
        </script>
    </body>
</html>
