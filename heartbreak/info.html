<!DOCTYPE html>
<html>
    <head>
        <title>heartbreak - info</title>
        <link rel="icon" type="image/x-icon" href="./images/favicon.png">
        <meta charset="UTF-8">
        <meta property="og:title" content="heartbreak">    
        <meta name="twitter:title" content="heartbreak">
        <meta property="og:description" content="work in progress art project by charlotte (@anundefineduser)">
        <meta name="twitter:description" content="work in progress art project by charlotte (@anundefineduser)">
        <meta name="description" content="work in progress art project by charlotte (@anundefineduser)">
        <meta property="og:image" content="/heartbreak/images/embed.png">
        <meta name="twitter:image" content="/heartbreak/images/embed.png">
        <meta name="twitter:card" content="summary_large_image">

        <style>
            body {
                background-color: #C2CECE;
                color: #5D6768;
                text-align: left;
                margin: none;
                padding: none;
                border: none;
                font-style: italic;
            }

            p, li {
                font-weight: bold;
                font-size: 16pt;
                padding: none;
                line-height: 1.5;
                color: #5D6768;
            }

            p {
                line-height: .6;
            }

            img {
                display: block;
                margin: none;
                padding: none;
                margin-left: auto;
                margin-right: auto;
                width: 30%;
                transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);

                -webkit-box-shadow:0px 0px 64px 0px rgba(0,0,0,0.32);
                -moz-box-shadow: 0px 0px 64px 0px rgba(0,0,0,0.32);
                box-shadow: 0px 0px 64px 0px rgba(0,0,0,0.32);
            }
            
            img:hover {
                transform: scale(1.02);
                transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            }
            img:active {
                transform: scale(.95);
                transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
        </style>
    </head>
    <body>
        <h1 style="text-align: center; font-weight: bold;">heartbreak - current info page (3/18/26)</h1>
        <p>heartless has been finished</p>
        <p>project probably like 15-20% done atp</p>
        <a onclick="goToFile('./music/heartless - heartbreak.mp3')" href="javascript:void(0);"><img src="./images/HEARTLESS.png"></a>
        
        <script>
            let accepted = localStorage.getItem("accepted") || "false";
            function goToFile(file) {
                if (accepted != "true") {
                    let confirmed = confirm("everything here currently (and in the future up till release) are a work in progress. this project is a work of art which'll change over time. do you accept this?");
                    if (confirmed)
                    {
                        localStorage.setItem("accepted", "true");
                        accepted = "true";
                        window.open(file, "_blank");
                        return true;
                    }
                    else
                    {
                        if (accepted != "false") {
                            localStorage.setItem("accepted", "false");
                            accepted = "false";
                        }
                        return false;
                    }
                }
                else
                    window.open(file, "_blank");
            }
        </script>
    </body>
</html>
